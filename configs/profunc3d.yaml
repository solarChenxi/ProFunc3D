# ProFunc3D paper configuration (fresh inference).
python: python
mask3d_python: /path/to/mask3d/environment/bin/python
fun3du_root: third_party/Fun3DU
dataset_root: data/scenefun3d
split: val
device: cuda:0

# Empty lists run the complete split. For a subset, set both visit IDs and the
# corresponding Fun3DU split indices.
visits: []
visit_indices: null

work_dir: outputs/val
grounding_observations: outputs/val/grounding/frames
contracts: outputs/val/contracts.json
track_dir: outputs/val/instance_tracks
track_report: outputs/val/instance_tracks.json
pga_output: outputs/val/pga_associations.json
prediction_dir: outputs/val/predictions

object_masks: owl2_rsam_v2
proposal_bank: outputs/val/proposal_bank
mask3d_checkpoint: /path/to/mask3d_f_checkpoint.ckpt
mask3d_processed: outputs/val/mask3d_processed
parent_overrides: null

pga:
  max_point_distance_px: 100.0
  surface_radius_px: 20.0
  generic_support_ratio: 1.30
  relational_support_ratio: 1.10

iar:
  dbscan_radius_m: 0.75
  temporal_alignment_s: 0.90
  context_window_s: 12.0
  timeline_sampling_s: 1.5
  point_stride: 35
  minimum_lifted_points: 8
  beta: 0.20
  gamma: 0.02

retrieval_label_chunk: 6
write_ply: true
visualization_points: 300000
