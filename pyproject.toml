[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profunc3d"
version = "0.1.0"
description = "Proposal-grounded 3D functionality grounding with instance-aware evidence reweighting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "torch>=2.0",
]

[project.optional-dependencies]
frontend = [
  "accelerate>=1.0",
  "hydra-core>=1.3",
  "imageio>=2.35",
  "imageio-ffmpeg>=0.5",
  "ollama>=0.3",
  "open3d>=0.18",
  "opencv-python>=4.10",
  "Pillow>=10.4",
  "scikit-image>=0.24",
  "tqdm>=4.66",
  "transformers==4.44.2",
]

[project.scripts]
profunc3d = "profunc3d.pipeline:main"
profunc3d-pga = "profunc3d.associate:main"
profunc3d-predict = "profunc3d.predict:main"

[tool.setuptools.packages.find]
include = ["profunc3d*"]
